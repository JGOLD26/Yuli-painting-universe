<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuli's Universe 🌟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      overflow: hidden;
    }
    #gameWrapper {
      position: relative;
      display: inline-block;
    }
    #gameCanvas {
      display: block;
      border: 4px solid #4a5fc1;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(74,95,193,0.6);
    }
    #startScreen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 50, 0.88);
      display: none; /* shown after background.png finishes loading */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 10;
    }
    #startScreen h1 {
      font-size: clamp(28px, 5vw, 52px);
      color: #ffe566;
      text-shadow: 0 0 20px #ffcc00, 2px 2px 0 #c47000;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    #startScreen p.subtitle {
      color: #aac8ff;
      font-size: clamp(13px, 2vw, 18px);
      margin-bottom: 30px;
    }
    .instructions {
      background: rgba(74,95,193,0.25);
      border: 2px solid #4a5fc1;
      border-radius: 12px;
      padding: 16px 28px;
      color: #ddeeff;
      font-size: clamp(12px, 1.8vw, 15px);
      line-height: 1.8;
      margin-bottom: 30px;
      max-width: 400px;
      text-align: center;
    }
    .instructions span { color: #ffe566; font-weight: bold; }
    #playBtn {
      background: linear-gradient(135deg, #ffe566, #ffaa00);
      border: none;
      border-radius: 50px;
      padding: 14px 50px;
      font-family: inherit;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: bold;
      color: #3a2000;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,170,0,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }
    #playBtn:hover { transform: scale(1.07); box-shadow: 0 6px 28px rgba(255,170,0,0.7); }
    #playBtn:active { transform: scale(0.97); }
    #scoreDisplay {
      position: absolute;
      top: 12px; right: 16px;
      color: #ffe566;
      font-size: clamp(15px, 2vw, 20px);
      text-shadow: 1px 1px 4px #000;
      pointer-events: none;
      z-index: 5;
    }
    #titleDisplay {
      position: absolute;
      top: 12px; left: 16px;
      color: #aac8ff;
      font-size: clamp(13px, 1.8vw, 17px);
      text-shadow: 1px 1px 4px #000;
      pointer-events: none;
      z-index: 5;
    }
    #loadingScreen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 50, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 20;
      color: #aac8ff;
      font-size: clamp(14px, 2vw, 20px);
    }
    #loadingScreen .load-title {
      color: #ffe566;
      font-size: clamp(22px, 4vw, 40px);
      text-shadow: 0 0 16px #ffcc00;
      margin-bottom: 18px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #4a5fc1;
      border-top-color: #ffe566;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="titleDisplay">🎨 Yuli's Universe</div>
  <div id="scoreDisplay">⭐ 0</div>
  <div id="loadingScreen">
    <div class="load-title">🎨 Yuli's Universe</div>
    <div class="spinner"></div>
    <div>Loading Yuli's painting…</div>
  </div>
  <div id="startScreen">
    <h1>🌟 Yuli's Universe 🌟</h1>
    <p class="subtitle">Inspired by Yuli's beautiful city painting ✨</p>
    <div class="instructions">
      <span>Forward / Back:</span> ↑ ↓ or W S<br/>
      <span>Left / Right:</span> ←→ or A D<br/>
      <span>Collect</span> all the ⭐ stars!<br/>
      Walk deep into Yuli's city! 🏙️
    </div>
    <button id="playBtn">▶ Play!</button>
  </div>
</div>

<script>
(function() {
"use strict";

// ─── Canvas Setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("startScreen");
const loadingScreen = document.getElementById("loadingScreen");
const scoreDisplay = document.getElementById("scoreDisplay");

// Painting native aspect ratio (will be updated once image loads).
// These defaults reflect the known painting dimensions used as a fallback.
const DEFAULT_PAINTING_W = 4096;
const DEFAULT_PAINTING_H = 3060;
let paintingRatio = DEFAULT_PAINTING_W / DEFAULT_PAINTING_H;

function resize() {
  const maxW = window.innerWidth - 16;
  const maxH = window.innerHeight - 16;
  let w = maxW, h = w / paintingRatio;
  if (h > maxH) { h = maxH; w = h * paintingRatio; }
  canvas.width = Math.floor(w);
  canvas.height = Math.floor(h);
  canvas.style.width = canvas.width + "px";
  canvas.style.height = canvas.height + "px";
}
resize();
window.addEventListener("resize", resize);

// ─── Background Image ─────────────────────────────────────────────────────────
const bgImg = new Image();
let bgLoaded = false;
bgImg.onload = function() {
  bgLoaded = true;
  paintingRatio = bgImg.naturalWidth / bgImg.naturalHeight;
  resize(); // re-fit canvas to actual image ratio
  loadingScreen.style.display = "none";
  startScreen.style.display = "flex";
};
bgImg.onerror = function() {
  loadingScreen.style.display = "none";
  startScreen.style.display = "flex";
};
bgImg.src = "background.png";

// ─── Perspective Constants ────────────────────────────────────────────────────
// z = 0 → near viewer (bottom of street), z = 1 → far horizon (top of street)
const HORIZON_Y_FRAC  = 0.60; // screen Y fraction where the vanishing point sits
const STREET_BTM_FRAC = 0.97; // screen Y fraction at the very bottom of the street

// Left/right street bounds (as fraction of canvas width) at near and far
const STR_L_NEAR = 0.08;
const STR_R_NEAR = 0.92;
const STR_L_FAR  = 0.38;
const STR_R_FAR  = 0.62;

// Avatar base height (pixels) at z = 0 (nearest)
const AVATAR_BASE_H    = 72;
const AVATAR_BASE_W    = 28;   // used for aspect ratio only
const AVATAR_MIN_SCALE = 0.13; // scale factor at z = 1 (horizon)

// Walkable depth/lateral limits (avatar cannot leave the visible street area)
const MIN_DEPTH    = 0.02; // nearest allowed z (just off the bottom edge)
const MAX_DEPTH    = 0.90; // farthest allowed z (short of the horizon)
const MIN_LATERAL  = 0.04; // leftmost allowed xFrac (small margin from kerb)
const MAX_LATERAL  = 0.96; // rightmost allowed xFrac

// Movement speeds (in perspective-space units per frame)
const DEPTH_SPEED   = 0.016; // how fast z changes
const LATERAL_SPEED = 0.018; // how fast xFrac changes
const FRICTION      = 0.80;

// ─── Perspective Helpers ──────────────────────────────────────────────────────
function getScale(z) {
  // Inverse-proportion perspective scale: returns 1.0 at z=0 (near) and
  // AVATAR_MIN_SCALE at z=1 (horizon), following a 1/(1+K·z) falloff that
  // matches how objects shrink in a real perspective projection.
  return 1.0 / (1.0 + z * (1.0 / AVATAR_MIN_SCALE - 1.0));
}

function getScreenPos(z, xFrac) {
  const horizY  = HORIZON_Y_FRAC  * canvas.height;
  const bottomY = STREET_BTM_FRAC * canvas.height;
  const screenY = horizY + (bottomY - horizY) * (1.0 - z);

  const leftBound  = (STR_L_NEAR + (STR_L_FAR - STR_L_NEAR) * z) * canvas.width;
  const rightBound = (STR_R_NEAR + (STR_R_FAR - STR_R_NEAR) * z) * canvas.width;
  const screenX    = leftBound + (rightBound - leftBound) * xFrac;

  return { x: screenX, y: screenY };
}

// ─── Stars (collectibles) ─────────────────────────────────────────────────────
const starData = [];
function genStars() {
  starData.length = 0;
  const positions = [
    {z:0.12, xFrac:0.30}, {z:0.12, xFrac:0.70},
    {z:0.22, xFrac:0.25}, {z:0.22, xFrac:0.75},
    {z:0.22, xFrac:0.50},
    {z:0.32, xFrac:0.35}, {z:0.32, xFrac:0.65},
    {z:0.42, xFrac:0.40}, {z:0.42, xFrac:0.60},
    {z:0.50, xFrac:0.50},
    {z:0.52, xFrac:0.32}, {z:0.52, xFrac:0.68},
    {z:0.62, xFrac:0.42}, {z:0.62, xFrac:0.58},
    {z:0.70, xFrac:0.50},
    {z:0.72, xFrac:0.44}, {z:0.72, xFrac:0.56},
    {z:0.80, xFrac:0.47}, {z:0.80, xFrac:0.53},
    {z:0.86, xFrac:0.50}
  ];
  for (const p of positions) {
    starData.push({
      z: p.z, xFrac: p.xFrac,
      collected: false,
      angle: Math.random() * Math.PI * 2,
      pulse: Math.random() * Math.PI * 2
    });
  }
}
genStars();

// ─── Particles ────────────────────────────────────────────────────────────────
const particles = [];

// ─── Avatar ───────────────────────────────────────────────────────────────────
const avatar = {
  z: 0.15,      // depth: 0 = near viewer, 1 = at horizon
  xFrac: 0.50,  // horizontal position within street bounds (0 = left, 1 = right)
  vz: 0,        // velocity in depth direction
  vx: 0,        // velocity in xFrac direction
  facingRight: true,
  walkFrame: 0,
  walkTimer: 0,
  bobOffset: 0,
  bobDir: 1,
  dustTimer: 0,
  wasMoving: false
};

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// ─── Game State ───────────────────────────────────────────────────────────────
let gameRunning = false;
let score = 0;

document.getElementById("playBtn").addEventListener("click", startGame);

function startGame() {
  startScreen.style.display = "none";
  gameRunning = true;
  score = 0;
  avatar.z    = 0.15;
  avatar.xFrac = 0.50;
  avatar.vz   = 0;
  avatar.vx   = 0;
  genStars();
  particles.length = 0;
  scoreDisplay.textContent = "⭐ 0";
  requestAnimationFrame(gameLoop);
}

// ─── Avatar Update ────────────────────────────────────────────────────────────
function updateAvatar() {
  const movingLeft  = keys["ArrowLeft"]  || keys["KeyA"];
  const movingRight = keys["ArrowRight"] || keys["KeyD"];
  const movingFwd   = keys["ArrowUp"]    || keys["KeyW"];
  const movingBack  = keys["ArrowDown"]  || keys["KeyS"];

  if (movingFwd)   avatar.vz += DEPTH_SPEED * 0.4;
  if (movingBack)  avatar.vz -= DEPTH_SPEED * 0.4;
  if (movingLeft)  { avatar.vx -= LATERAL_SPEED * 0.4; avatar.facingRight = false; }
  if (movingRight) { avatar.vx += LATERAL_SPEED * 0.4; avatar.facingRight = true;  }

  avatar.vz *= FRICTION;
  avatar.vx *= FRICTION;
  if (Math.abs(avatar.vz) < 0.0003) avatar.vz = 0;
  if (Math.abs(avatar.vx) < 0.0003) avatar.vx = 0;

  avatar.z    += avatar.vz;
  avatar.xFrac += avatar.vx;

  // Clamp depth — stay on the street (not past the horizon)
  if (avatar.z < MIN_DEPTH) { avatar.z = MIN_DEPTH; avatar.vz = 0; }
  if (avatar.z > MAX_DEPTH) { avatar.z = MAX_DEPTH; avatar.vz = 0; }

  // Clamp lateral — stay within street bounds
  if (avatar.xFrac < MIN_LATERAL) { avatar.xFrac = MIN_LATERAL; avatar.vx = 0; }
  if (avatar.xFrac > MAX_LATERAL) { avatar.xFrac = MAX_LATERAL; avatar.vx = 0; }

  const isMoving = movingLeft || movingRight || movingFwd || movingBack;

  // Walk animation
  avatar.walkTimer += isMoving ? 1 : 0;
  if (avatar.walkTimer > 8) { avatar.walkTimer = 0; avatar.walkFrame = (avatar.walkFrame + 1) % 4; }

  // Idle bob
  if (!isMoving) {
    avatar.bobOffset += 0.06 * avatar.bobDir;
    if (Math.abs(avatar.bobOffset) > 1.5) avatar.bobDir *= -1;
  } else {
    avatar.bobOffset *= 0.85;
  }

  // Dust puffs while walking
  if (isMoving) {
    avatar.dustTimer++;
    if (avatar.dustTimer > 9) {
      avatar.dustTimer = 0;
      const pos = getScreenPos(avatar.z, avatar.xFrac);
      const scale = getScale(avatar.z);
      spawnDust(pos.x, pos.y, scale);
    }
  } else {
    avatar.dustTimer = 0;
  }
  avatar.wasMoving = isMoving;
}

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnDust(x, y, scale) {
  for (let i = 0; i < 3; i++) {
    particles.push({
      type: "dust",
      x, y,
      vx: (Math.random() - 0.5) * 2.0 * scale,
      vy: -Math.random() * 1.2 * scale - 0.3,
      life: 1, maxLife: 1,
      size: (3 + Math.random() * 3) * scale,
      color: "rgba(180,160,120,"
    });
  }
}

function spawnSparkles(x, y, scale) {
  for (let i = 0; i < 18; i++) {
    const angle = (i / 18) * Math.PI * 2;
    const speed = (2 + Math.random() * 3) * Math.max(scale, 0.3);
    particles.push({
      type: "sparkle",
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      life: 1, maxLife: 1,
      size: (3 + Math.random() * 4) * Math.max(scale, 0.3),
      color: ["#ffe566","#ffcc00","#fff","#ffaa00","#aaffee"][Math.floor(Math.random() * 5)]
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.08;
    p.vx *= 0.92;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ─── Star Collection ──────────────────────────────────────────────────────────
function checkStarCollection() {
  for (const s of starData) {
    if (s.collected) continue;

    const dz    = Math.abs(avatar.z    - s.z);
    const dxFrac = Math.abs(avatar.xFrac - s.xFrac);

    // Collect when close enough in both depth and lateral dimensions
    if (dz < 0.06 && dxFrac < 0.08) {
      s.collected = true;
      score++;
      scoreDisplay.textContent = `⭐ ${score}`;
      const pos   = getScreenPos(s.z, s.xFrac);
      const scale = getScale(s.z);
      spawnSparkles(pos.x, pos.y, scale);
    }
  }
}

// ─── Drawing Functions ────────────────────────────────────────────────────────

function drawBackground() {
  if (bgLoaded) {
    // Fill the canvas with the full painting — no stretching because canvas
    // is already sized to match the painting's aspect ratio.
    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, "#b8d8f8");
    grad.addColorStop(1, "#e8f4ff");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function drawAvatar(a) {
  const pos   = getScreenPos(a.z, a.xFrac);
  const scale = getScale(a.z);

  const ah  = AVATAR_BASE_H * scale;
  const aw  = ah * (AVATAR_BASE_W / AVATAR_BASE_H);
  const cx  = pos.x;
  const bot = pos.y + a.bobOffset * scale; // feet touch the ground point
  const top = bot - ah;
  const dir = a.facingRight ? 1 : -1;

  const legSwing = Math.sin(a.walkFrame / 4 * Math.PI * 2) * 10 * scale;

  ctx.save();

  // Shadow (scales and fades with depth)
  ctx.globalAlpha = 0.22 * (1 - a.z * 0.6);
  ctx.fillStyle = "rgba(0,0,50,1)";
  ctx.beginPath();
  ctx.ellipse(cx, bot + 2 * scale, aw * 0.65, 4 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Legs
  ctx.strokeStyle = "#5544cc";
  ctx.lineWidth = Math.max(1, 5 * scale);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx - 6 * scale, top + ah * 0.65);
  ctx.lineTo(cx - 6 * scale - legSwing * 0.4, bot + 2 * scale);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 6 * scale, top + ah * 0.65);
  ctx.lineTo(cx + 6 * scale + legSwing * 0.4, bot + 2 * scale);
  ctx.stroke();

  // Body
  ctx.fillStyle = "#6655dd";
  ctx.beginPath();
  ctx.roundRect(cx - aw / 2 + 3 * scale, top + ah * 0.35, aw - 6 * scale, ah * 0.35, 6 * scale);
  ctx.fill();
  ctx.strokeStyle = "#4433aa";
  ctx.lineWidth = Math.max(0.5, 1.5 * scale);
  ctx.stroke();

  // Outfit detail
  ctx.fillStyle = "#ffe566";
  ctx.fillRect(cx - aw / 2 + 5 * scale, top + ah * 0.38, 5 * scale, ah * 0.2);

  // Arms
  ctx.strokeStyle = "#5544cc";
  ctx.lineWidth = Math.max(1, 5 * scale);
  ctx.lineCap = "round";
  const armSwing = Math.sin(a.walkFrame / 4 * Math.PI * 2 + Math.PI) * 8 * scale;
  ctx.beginPath();
  ctx.moveTo(cx - aw / 2 + 4 * scale, top + ah * 0.38);
  ctx.lineTo(cx - aw / 2 + 4 * scale - dir * 8 * scale - armSwing * 0.3, top + ah * 0.58);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + aw / 2 - 4 * scale, top + ah * 0.38);
  ctx.lineTo(cx + aw / 2 - 4 * scale + dir * 8 * scale + armSwing * 0.3, top + ah * 0.58);
  ctx.stroke();

  // Head
  const headR = aw * 0.42;
  ctx.fillStyle = "#ffddb0";
  ctx.beginPath();
  ctx.arc(cx, top + ah * 0.22, headR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#cc9966";
  ctx.lineWidth = Math.max(0.5, 1.5 * scale);
  ctx.stroke();

  // Hair
  ctx.fillStyle = "#8833aa";
  ctx.beginPath();
  ctx.arc(cx, top + ah * 0.14, headR, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + dir * 6 * scale, top + ah * 0.06, 5 * scale, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  const eyeR = Math.max(0.5, 2.2 * scale);
  ctx.fillStyle = "#220044";
  ctx.beginPath();
  ctx.arc(cx - dir * 3 * scale - 4 * scale, top + ah * 0.2, eyeR, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx - dir * 3 * scale + 4 * scale, top + ah * 0.2, eyeR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(cx - dir * 3 * scale - 3 * scale, top + ah * 0.19, Math.max(0.3, 0.9 * scale), 0, Math.PI * 2);
  ctx.fill();

  // Smile
  ctx.strokeStyle = "#cc6644";
  ctx.lineWidth = Math.max(0.5, 1.8 * scale);
  ctx.beginPath();
  ctx.arc(cx, top + ah * 0.26, 4 * scale, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Rosy cheeks
  ctx.fillStyle = "rgba(255,120,100,0.35)";
  ctx.beginPath();
  ctx.ellipse(cx - 7 * scale, top + ah * 0.25, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 7 * scale, top + ah * 0.25, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawStar(s) {
  if (s.collected) return;

  const pos   = getScreenPos(s.z, s.xFrac);
  const scale = getScale(s.z);
  const alpha = 1.0 - s.z * 0.35; // slightly faded at distance

  s.angle += 0.04;
  s.pulse += 0.07;
  const pScale = 1 + Math.sin(s.pulse) * 0.12;
  const r = 13 * scale * pScale;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(pos.x, pos.y);
  ctx.rotate(s.angle);

  // Glow
  const glowR = r + 6 * scale;
  const glow = ctx.createRadialGradient(0, 0, 2 * scale, 0, 0, glowR);
  glow.addColorStop(0, "rgba(255,230,80,0.6)");
  glow.addColorStop(1, "rgba(255,200,0,0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, glowR, 0, Math.PI * 2);
  ctx.fill();

  // 5-point star shape
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.42;
    if (i === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
    else         ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = "#ffe566";
  ctx.fill();
  ctx.strokeStyle = "#cc8800";
  ctx.lineWidth = Math.max(0.5, 1.5 * scale);
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life);
    if (p.type === "dust") {
      ctx.fillStyle = p.color + alpha.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawTitleAndScore() {
  ctx.save();
  ctx.font = `bold ${Math.max(14, canvas.width * 0.022)}px "Comic Sans MS", cursive`;
  ctx.fillStyle = "#aac8ff";
  ctx.shadowColor = "#000";
  ctx.shadowBlur = 4;
  ctx.fillText("🎨 Yuli's Universe", 12, 28);

  ctx.font = `bold ${Math.max(14, canvas.width * 0.024)}px "Comic Sans MS", cursive`;
  ctx.fillStyle = "#ffe566";
  ctx.textAlign = "right";
  ctx.fillText(`⭐ ${score}`, canvas.width - 12, 28);
  ctx.restore();
}

// ─── Main Game Loop ────────────────────────────────────────────────────────────
let lastTime = 0;

function gameLoop(timestamp) {
  if (!gameRunning) return;
  lastTime = timestamp;

  updateAvatar();
  updateParticles();
  checkStarCollection();

  // Draw the full painting as background (no camera scroll)
  drawBackground();

  // Collect all scene objects and sort by z (draw furthest first)
  const objects = [];

  for (const s of starData) {
    if (!s.collected) objects.push({ type: "star", z: s.z, ref: s });
  }
  objects.push({ type: "avatar", z: avatar.z });

  objects.sort((a, b) => b.z - a.z); // furthest first

  for (const obj of objects) {
    if (obj.type === "star")   drawStar(obj.ref);
    else                       drawAvatar(avatar);
  }

  drawParticles();
  drawTitleAndScore();

  requestAnimationFrame(gameLoop);
}
})();
</script>
