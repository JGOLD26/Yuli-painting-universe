<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuli's Universe 🌟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      overflow: hidden;
    }
    #gameWrapper {
      position: relative;
      display: inline-block;
    }
    #gameCanvas {
      display: block;
      border: 4px solid #4a5fc1;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(74,95,193,0.6);
    }
    #startScreen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 50, 0.88);
      display: none; /* shown after background.png finishes loading */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 10;
    }
    #startScreen h1 {
      font-size: clamp(28px, 5vw, 52px);
      color: #ffe566;
      text-shadow: 0 0 20px #ffcc00, 2px 2px 0 #c47000;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    #startScreen p.subtitle {
      color: #aac8ff;
      font-size: clamp(13px, 2vw, 18px);
      margin-bottom: 30px;
    }
    .instructions {
      background: rgba(74,95,193,0.25);
      border: 2px solid #4a5fc1;
      border-radius: 12px;
      padding: 16px 28px;
      color: #ddeeff;
      font-size: clamp(12px, 1.8vw, 15px);
      line-height: 1.8;
      margin-bottom: 30px;
      max-width: 400px;
      text-align: center;
    }
    .instructions span { color: #ffe566; font-weight: bold; }
    #playBtn {
      background: linear-gradient(135deg, #ffe566, #ffaa00);
      border: none;
      border-radius: 50px;
      padding: 14px 50px;
      font-family: inherit;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: bold;
      color: #3a2000;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,170,0,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }
    #playBtn:hover { transform: scale(1.07); box-shadow: 0 6px 28px rgba(255,170,0,0.7); }
    #playBtn:active { transform: scale(0.97); }
    #scoreDisplay {
      position: absolute;
      top: 12px; right: 16px;
      color: #ffe566;
      font-size: clamp(15px, 2vw, 20px);
      text-shadow: 1px 1px 4px #000;
      pointer-events: none;
      z-index: 5;
    }
    #titleDisplay {
      position: absolute;
      top: 12px; left: 16px;
      color: #aac8ff;
      font-size: clamp(13px, 1.8vw, 17px);
      text-shadow: 1px 1px 4px #000;
      pointer-events: none;
      z-index: 5;
    }
    #loadingScreen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 50, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 20;
      color: #aac8ff;
      font-size: clamp(14px, 2vw, 20px);
    }
    #loadingScreen .load-title {
      color: #ffe566;
      font-size: clamp(22px, 4vw, 40px);
      text-shadow: 0 0 16px #ffcc00;
      margin-bottom: 18px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #4a5fc1;
      border-top-color: #ffe566;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="titleDisplay">🎨 Yuli's Universe</div>
  <div id="scoreDisplay">⭐ 0</div>
  <div id="loadingScreen">
    <div class="load-title">🎨 Yuli's Universe</div>
    <div class="spinner"></div>
    <div>Loading Yuli's painting…</div>
  </div>
  <div id="startScreen">
    <h1>🌟 Yuli's Universe 🌟</h1>
    <p class="subtitle">Inspired by Yuli's beautiful city painting ✨</p>
    <div class="instructions">
      <span>Move:</span> Arrow Keys or WASD<br/>
      <span>Jump:</span> ↑ / W / Space<br/>
      <span>Collect</span> all the ⭐ stars!<br/>
      The world is big — go explore! 🏙️
    </div>
    <button id="playBtn">▶ Play!</button>
  </div>
</div>

<script>
(function() {
"use strict";

// ─── Canvas Setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("startScreen");
const loadingScreen = document.getElementById("loadingScreen");
const scoreDisplay = document.getElementById("scoreDisplay");

function resize() {
  const maxW = Math.min(window.innerWidth - 16, 900);
  const maxH = Math.min(window.innerHeight - 16, 550);
  const ratio = 900 / 550;
  let w = maxW, h = maxW / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  canvas.width = Math.floor(w);
  canvas.height = Math.floor(h);
  canvas.style.width = canvas.width + "px";
  canvas.style.height = canvas.height + "px";
}
resize();
window.addEventListener("resize", resize);

// ─── Background Image ─────────────────────────────────────────────────────────
const bgImg = new Image();
let bgLoaded = false;
bgImg.onload = function() {
  bgLoaded = true;
  loadingScreen.style.display = "none";
  startScreen.style.display = "flex";
};
bgImg.onerror = function() {
  // Fallback: hide loading screen even if image fails
  loadingScreen.style.display = "none";
  startScreen.style.display = "flex";
};
bgImg.src = "background.png";

// ─── Constants ───────────────────────────────────────────────────────────────
const WORLD_W = 3200;
const GROUND_Y_FRAC = 0.83; // avatar ground at 83% of canvas height (painting street ~bottom 17%)

function groundY() { return canvas.height * GROUND_Y_FRAC; }

// Stars (collectibles)
const starData = [];
function genStars() {
  starData.length = 0;
  const positions = [
    {x:200,  y:0.92},{x:450,  y:0.75},{x:580,  y:0.85},
    {x:750,  y:0.62},{x:900,  y:0.88},{x:1050, y:0.70},
    {x:1200, y:0.80},{x:1350, y:0.65},{x:1500, y:0.90},
    {x:1650, y:0.72},{x:1800, y:0.62},{x:1950, y:0.83},
    {x:2100, y:0.75},{x:2250, y:0.67},{x:2400, y:0.88},
    {x:2550, y:0.60},{x:2700, y:0.78},{x:2850, y:0.65},
    {x:3000, y:0.85},{x:3100, y:0.72}
  ];
  for (const p of positions) {
    starData.push({ x: p.x, yFrac: p.y, collected: false, angle: Math.random() * Math.PI * 2, pulse: Math.random() * Math.PI * 2 });
  }
}
genStars();

// Particles
const particles = [];

// ─── Avatar ───────────────────────────────────────────────────────────────────
const avatar = {
  x: 200,
  y: 0,
  w: 28,
  h: 44,
  vx: 0,
  vy: 0,
  onGround: false,
  facingRight: true,
  walkFrame: 0,
  walkTimer: 0,
  bobOffset: 0,
  bobDir: 1,
  dustTimer: 0,
  wasMoving: false
};

// ─── Camera ───────────────────────────────────────────────────────────────────
let camX = 0;

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  // Prevent page scroll
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// ─── Game State ───────────────────────────────────────────────────────────────
let gameRunning = false;
let score = 0;
let totalTime = 0;

document.getElementById("playBtn").addEventListener("click", startGame);

function startGame() {
  startScreen.style.display = "none";
  gameRunning = true;
  score = 0;
  avatar.x = 200;
  avatar.y = groundY() - avatar.h;
  avatar.vx = 0; avatar.vy = 0;
  camX = 0;
  genStars();
  particles.length = 0;
  scoreDisplay.textContent = "⭐ 0";
  requestAnimationFrame(gameLoop);
}

// ─── Physics ──────────────────────────────────────────────────────────────────
const GRAVITY = 0.55;
const JUMP_VEL = -13;
const MOVE_SPEED = 3.8;
const FRICTION = 0.82;

function updateAvatar(dt) {
  const gY = groundY();

  // Horizontal movement
  const movingLeft  = keys["ArrowLeft"]  || keys["KeyA"];
  const movingRight = keys["ArrowRight"] || keys["KeyD"];
  const jumping     = keys["ArrowUp"]    || keys["KeyW"] || keys["Space"];

  if (movingLeft)  { avatar.vx -= MOVE_SPEED * 0.35; avatar.facingRight = false; }
  if (movingRight) { avatar.vx += MOVE_SPEED * 0.35; avatar.facingRight = true;  }

  avatar.vx *= FRICTION;
  if (Math.abs(avatar.vx) < 0.05) avatar.vx = 0;

  // Jump
  if (jumping && avatar.onGround) {
    avatar.vy = JUMP_VEL;
    avatar.onGround = false;
  }

  // Gravity
  avatar.vy += GRAVITY;
  if (avatar.vy > 18) avatar.vy = 18;

  avatar.x += avatar.vx;
  avatar.y += avatar.vy;

  // Clamp to world
  if (avatar.x < 0) { avatar.x = 0; avatar.vx = 0; }
  if (avatar.x + avatar.w > WORLD_W) { avatar.x = WORLD_W - avatar.w; avatar.vx = 0; }

  // Ground collision
  if (avatar.y + avatar.h >= gY) {
    avatar.y = gY - avatar.h;
    avatar.vy = 0;
    avatar.onGround = true;
  } else {
    avatar.onGround = false;
  }

  // Walk animation
  const isMoving = (movingLeft || movingRight) && avatar.onGround;
  avatar.walkTimer += isMoving ? 1 : 0;
  if (avatar.walkTimer > 8) { avatar.walkTimer = 0; avatar.walkFrame = (avatar.walkFrame + 1) % 4; }

  // Idle bob
  if (!isMoving && avatar.onGround) {
    avatar.bobOffset += 0.06 * avatar.bobDir;
    if (Math.abs(avatar.bobOffset) > 1.5) avatar.bobDir *= -1;
  } else {
    avatar.bobOffset *= 0.85;
  }

  // Dust effect
  if (isMoving && !avatar.wasMoving) {
    spawnDust(avatar.x + avatar.w / 2, gY);
  }
  if (isMoving) {
    avatar.dustTimer++;
    if (avatar.dustTimer > 7) {
      avatar.dustTimer = 0;
      spawnDust(avatar.x + (avatar.facingRight ? 0 : avatar.w), gY - 2);
    }
  }
  avatar.wasMoving = isMoving;

  // Camera
  const targetCamX = avatar.x - canvas.width / 2 + avatar.w / 2;
  camX += (targetCamX - camX) * 0.1;
  camX = Math.max(0, Math.min(WORLD_W - canvas.width, camX));
}

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnDust(x, y) {
  for (let i = 0; i < 4; i++) {
    particles.push({
      type: "dust",
      x, y,
      vx: (Math.random() - 0.5) * 2.5,
      vy: -Math.random() * 1.5 - 0.5,
      life: 1, maxLife: 1,
      size: 3 + Math.random() * 3,
      color: "rgba(180,160,120,"
    });
  }
}

function spawnSparkles(x, y) {
  for (let i = 0; i < 18; i++) {
    const angle = (i / 18) * Math.PI * 2;
    const speed = 2 + Math.random() * 3;
    particles.push({
      type: "sparkle",
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1, maxLife: 1,
      size: 3 + Math.random() * 4,
      color: ["#ffe566","#ffcc00","#fff","#ffaa00","#aaffee"][Math.floor(Math.random()*5)]
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.vx *= 0.92;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ─── Star Collection ──────────────────────────────────────────────────────────
function checkStarCollection() {
  const gY = groundY();
  for (const s of starData) {
    if (s.collected) continue;
    const sy = gY * s.yFrac;
    const sx = s.x;
    // Collision radius
    if (Math.abs((avatar.x + avatar.w/2) - sx) < 24 &&
        Math.abs((avatar.y + avatar.h/2) - sy) < 24) {
      s.collected = true;
      score++;
      scoreDisplay.textContent = `⭐ ${score}`;
      spawnSparkles(sx - camX, sy);
    }
  }
}

// ─── Drawing Functions ────────────────────────────────────────────────────────

function drawBackground() {
  if (bgLoaded) {
    // Draw only the visible slice of the painting for performance.
    // Parallax: background scrolls at 0.7x the camera speed for depth effect.
    const parallax = 0.7;
    const imgW = bgImg.naturalWidth;
    const imgH = bgImg.naturalHeight;
    // Map the visible screen region back to image source coordinates
    const srcX = (camX * parallax) * (imgW / WORLD_W);
    const srcW = canvas.width * (imgW / WORLD_W);
    ctx.drawImage(bgImg, srcX, 0, srcW, imgH, 0, 0, canvas.width, canvas.height);
  } else {
    // Fallback sky while loading
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, "#b8d8f8");
    grad.addColorStop(1, "#e8f4ff");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function drawGroundLine() {
  // Subtle ground line so avatar has a clear visual standing surface
  const gY = groundY();
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = "#2a1a00";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, gY);
  ctx.lineTo(canvas.width, gY);
  ctx.stroke();
  ctx.restore();
}

function drawAvatar(a, camX) {
  const ax = a.x - camX;
  const ay = a.y + a.bobOffset;
  const aw = a.w;
  const ah = a.h;
  const cx2 = ax + aw / 2;
  const dir = a.facingRight ? 1 : -1;

  // Walk leg animation
  const legSwing = a.onGround ? Math.sin(a.walkFrame / 4 * Math.PI * 2) * 10 : 0;

  ctx.save();

  // Shadow
  ctx.fillStyle = "rgba(0,0,80,0.18)";
  ctx.beginPath();
  ctx.ellipse(cx2, ay + ah + 2, aw * 0.6, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  ctx.strokeStyle = "#5544cc";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  // Left leg
  ctx.beginPath();
  ctx.moveTo(cx2 - 6, ay + ah * 0.65);
  ctx.lineTo(cx2 - 6 - legSwing * 0.4, ay + ah + 2);
  ctx.stroke();
  // Right leg
  ctx.beginPath();
  ctx.moveTo(cx2 + 6, ay + ah * 0.65);
  ctx.lineTo(cx2 + 6 + legSwing * 0.4, ay + ah + 2);
  ctx.stroke();

  // Body
  ctx.fillStyle = "#6655dd";
  ctx.beginPath();
  ctx.roundRect(ax + 3, ay + ah * 0.35, aw - 6, ah * 0.35, 6);
  ctx.fill();
  ctx.strokeStyle = "#4433aa";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Backpack/outfit detail
  ctx.fillStyle = "#ffe566";
  ctx.fillRect(ax + 5, ay + ah * 0.38, 5, ah * 0.2);

  // Arms
  ctx.strokeStyle = "#5544cc";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  const armSwing = a.onGround ? Math.sin(a.walkFrame / 4 * Math.PI * 2 + Math.PI) * 8 : 0;
  ctx.beginPath();
  ctx.moveTo(ax + 4, ay + ah * 0.38);
  ctx.lineTo(ax + 4 - dir * 8 - armSwing * 0.3, ay + ah * 0.58);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ax + aw - 4, ay + ah * 0.38);
  ctx.lineTo(ax + aw - 4 + dir * 8 + armSwing * 0.3, ay + ah * 0.58);
  ctx.stroke();

  // Head
  ctx.fillStyle = "#ffddb0";
  ctx.beginPath();
  ctx.arc(cx2, ay + ah * 0.22, aw * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#cc9966";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Hair
  ctx.fillStyle = "#8833aa";
  ctx.beginPath();
  ctx.arc(cx2, ay + ah * 0.14, aw * 0.42, Math.PI, Math.PI * 2);
  ctx.fill();
  // Hair tuft
  ctx.beginPath();
  ctx.arc(cx2 + dir * 6, ay + ah * 0.06, 5, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = "#220044";
  ctx.beginPath();
  ctx.arc(cx2 - dir * 6 * 0.5 - 4, ay + ah * 0.2, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx2 - dir * 6 * 0.5 + 4, ay + ah * 0.2, 2.2, 0, Math.PI * 2);
  ctx.fill();
  // Shine
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(cx2 - dir * 6 * 0.5 - 3, ay + ah * 0.19, 0.9, 0, Math.PI * 2);
  ctx.fill();

  // Smile
  ctx.strokeStyle = "#cc6644";
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx2, ay + ah * 0.26, 4, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Rosy cheeks
  ctx.fillStyle = "rgba(255,120,100,0.35)";
  ctx.beginPath();
  ctx.ellipse(cx2 - 7, ay + ah * 0.25, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx2 + 7, ay + ah * 0.25, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawStar(s, camX) {
  if (s.collected) return;
  const gY = groundY();
  const sx = s.x - camX;
  const sy = gY * s.yFrac;

  if (sx < -30 || sx > canvas.width + 30) return;

  s.angle += 0.04;
  s.pulse += 0.07;
  const scale = 1 + Math.sin(s.pulse) * 0.12;
  const r = 13 * scale;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(s.angle);
  ctx.scale(scale, scale);

  // Glow
  const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, r + 6);
  glow.addColorStop(0, "rgba(255,230,80,0.6)");
  glow.addColorStop(1, "rgba(255,200,0,0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
  ctx.fill();

  // 5-point star
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.42;
    if (i === 0) ctx.moveTo(Math.cos(angle) * rad, Math.sin(angle) * rad);
    else ctx.lineTo(Math.cos(angle) * rad, Math.sin(angle) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = "#ffe566";
  ctx.fill();
  ctx.strokeStyle = "#cc8800";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();
}

function drawParticles(camX) {
  for (const p of particles) {
    const alpha = Math.max(0, p.life);
    if (p.type === "dust") {
      ctx.fillStyle = p.color + alpha.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Sparkle
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawTitleAndScore() {
  // Title
  ctx.save();
  ctx.font = `bold ${Math.max(14, canvas.width * 0.022)}px "Comic Sans MS", cursive`;
  ctx.fillStyle = "#aac8ff";
  ctx.shadowColor = "#000";
  ctx.shadowBlur = 4;
  ctx.fillText("🎨 Yuli's Universe", 12, 28);

  // Score
  ctx.font = `bold ${Math.max(14, canvas.width * 0.024)}px "Comic Sans MS", cursive`;
  ctx.fillStyle = "#ffe566";
  ctx.textAlign = "right";
  ctx.fillText(`⭐ ${score}`, canvas.width - 12, 28);
  ctx.restore();
}

// ─── Main Game Loop ────────────────────────────────────────────────────────────
let lastTime = 0;

function gameLoop(timestamp) {
  if (!gameRunning) return;
  const dt = Math.min((timestamp - lastTime) / 16.67, 3);
  lastTime = timestamp;
  totalTime++;

  // Update
  updateAvatar(dt);
  updateParticles();
  checkStarCollection();

  // Draw background (Yuli's painting with parallax)
  drawBackground();

  // Draw subtle ground line
  drawGroundLine();

  // Draw stars
  for (const s of starData) {
    drawStar(s, camX);
  }

  // Draw avatar
  drawAvatar(avatar, camX);

  // Draw particles
  drawParticles(camX);

  // Draw UI
  drawTitleAndScore();

  requestAnimationFrame(gameLoop);
}
})();
</script>
</body>
</html>
